# Nginx reverse proxy configuration for ZKTeco ADMS Server
server {
    listen 80;
    server_name attendance.yourdomain.com;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent response buffering so heartbeat and registration acks return immediately
        proxy_buffering off;

        # Pass through the server's calculated Date header
        proxy_pass_header Date;

        # Timeouts for persistent device connections
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

